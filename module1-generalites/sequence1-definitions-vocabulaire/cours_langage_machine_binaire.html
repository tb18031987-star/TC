<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le langage machine et le système binaire</title>
<style>
/* ============ Jetons de design ============ */
:root{
  --ink:#1B1740; --paper:#F1EFFF; --card:#fff;
  --blue:#3D3BF3; --blue-l:#DDDCFF;
  --sun:#FFD23F; --sun-l:#FFF3BF;
  --coral:#FF5D73; --coral-l:#FFE0E5;
  --mint:#22C58B; --mint-l:#D5F7EA;
  --sky:#BFE6FF;
  --bd:3px solid var(--ink);
  --sh:4px 4px 0 var(--ink);
  --mono:"Consolas","SF Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;color:var(--ink);background:var(--paper);min-height:100vh;
  background-image:radial-gradient(var(--blue-l) 1.5px,transparent 1.5px);background-size:26px 26px;
  font-family:"Arial Rounded MT Bold","Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
h1,h2,h3{line-height:1.15;margin:0 0 .6rem}
p{margin:0 0 .8rem}
.mono{font-family:var(--mono);font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}

/* ============ Boutons et petits éléments ============ */
.btn{font-weight:800;border:var(--bd);border-radius:999px;padding:.55rem 1.3rem;background:var(--sun);
  box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.blue{background:var(--blue);color:#fff}
.btn.mint{background:var(--mint)}
.btn.coral{background:var(--coral)}
.btn.big{font-size:1.15rem;padding:.75rem 1.7rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{border:var(--bd);background:#fff;border-radius:12px;width:2.4rem;height:2.4rem;cursor:pointer;font-size:1.1rem;box-shadow:2px 2px 0 var(--ink)}
.chip{border:var(--bd);border-radius:999px;padding:.1rem .8rem;font-weight:800;background:#fff}
.okc{background:var(--mint-l)} .errc{background:var(--coral-l)}
.card{background:var(--card);border:var(--bd);border-radius:18px;box-shadow:var(--sh);padding:1.2rem 1.4rem}
.lead{font-size:1.05rem}

/* ============ En-tête et moniteur 50 min ============ */
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:.7rem 1.2rem;align-items:center;justify-content:space-between;
  padding:.6rem 1rem;background:var(--ink);color:#fff;border-bottom:var(--bd)}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800}
.brand b{font-family:var(--mono);background:var(--sun);color:var(--ink);border-radius:8px;padding:.1rem .5rem}
.timer{display:grid;gap:.25rem;min-width:min(340px,100%);flex:1;max-width:420px}
.tface{display:flex;align-items:center;gap:.6rem;justify-content:space-between}
.tlab{font-size:.8rem;opacity:.8}
#tmr{font-size:1.8rem;line-height:1;background:#fff;color:var(--ink);border-radius:10px;padding:.1rem .7rem;border:var(--bd)}
#tmr.late{background:var(--coral)}
.tbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg{height:10px;border-radius:6px;background:#3a3566;overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--sun)}
.tstat{font-size:.8rem}
.tstat.ok{color:#8FF0C8} .tstat.bad{color:#FFB0BC}
.tools{display:flex;align-items:center;gap:.5rem}

/* ============ Cadre principal ============ */
#app{max-width:1000px;margin:0 auto;padding:1rem 1rem 6rem}
body.paused #app{filter:blur(10px);pointer-events:none}
.pausebanner{display:none;position:fixed;inset:35% 0 auto;text-align:center;font-size:2rem;font-weight:800;z-index:30}
body.paused .pausebanner{display:block}

/* ============ Page de garde ============ */
.cover{display:grid;grid-template-columns:1.1fr 1fr;gap:1.6rem;align-items:start;padding-top:1rem}
.hero h1{font-size:2.6rem}
.hero .sub{font-size:1.4rem;color:var(--blue);font-weight:800}
.hero .lvl{display:inline-block;background:var(--sun);border:var(--bd);border-radius:10px;padding:.1rem .7rem;margin-bottom:.8rem;font-weight:800}
.flipper{display:inline-grid;place-items:center;min-width:11rem;height:5rem;padding:0 1.2rem;margin:.6rem 0 1rem;
  background:var(--blue);color:#fff;border:var(--bd);border-radius:16px;box-shadow:var(--sh);font-family:var(--mono);font-weight:800;font-size:2.4rem}
.rules{padding-left:1.2rem}
.rules li{margin-bottom:.3rem}
.setup label{display:block;font-weight:800;margin:.6rem 0 .2rem}
.inp{font:inherit;width:100%;padding:.5rem .8rem;border:var(--bd);border-radius:12px;background:#fff}
.inp.mono{letter-spacing:.05em}
.err{color:#C21F3A;font-weight:800;min-height:1.4rem}
.resume{background:var(--sun-l);margin-top:1rem}

/* ============ Barre de progression ============ */
.chs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
.ch{flex:1;min-width:140px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:.5rem;align-items:center;
  border:var(--bd);border-radius:14px;padding:.35rem .7rem;background:#fff}
.ch .n{grid-row:span 2;display:grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;border:var(--bd);font-weight:800;background:var(--paper)}
.ch .t{font-weight:800;font-size:.9rem;line-height:1.1}
.ch small{font-size:.75rem;opacity:.7}
.ch.done{background:var(--mint-l)} .ch.done .n{background:var(--mint)}
.ch.cur{background:var(--blue);color:#fff;box-shadow:var(--sh)} .ch.cur .n{background:var(--sun);color:var(--ink)}
.ch.lock{opacity:.55}
.sts{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.s{border:var(--bd);border-radius:999px;padding:.15rem .8rem;font-size:.9rem;font-weight:800;background:#fff}
.s.done{background:var(--mint-l)} .s.cur{background:var(--sun)} .s.lock{opacity:.5}

/* ============ Scène d’une étape ============ */
.stage{min-height:340px}
.stage-h{font-size:1.6rem;display:flex;align-items:center;gap:.6rem}
.stage-h .sm{font-size:.95rem;font-weight:700;opacity:.65}
.foot{margin-top:1.4rem;text-align:right}

/* Questions */
.q{border:var(--bd);border-radius:14px;padding:.9rem 1rem;margin:0 0 1rem;background:var(--sun-l)}
.q.solved{background:var(--mint-l)}
.qt{font-weight:800;margin-bottom:.6rem}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}
.opt{border:var(--bd);border-radius:12px;background:#fff;padding:.4rem 1rem;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.opt:hover:not(:disabled){background:var(--blue-l)}
.opt.good{background:var(--mint)} .opt.bad{background:var(--coral-l);text-decoration:line-through}
.opt:disabled:not(.good){opacity:.6}
.fb{margin:.6rem 0 0;font-weight:700;min-height:1.2rem}
.fb.good{color:#0B7A55} .fb.bad{color:#C21F3A}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.row .inp{flex:1;min-width:8rem}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* Phrases à trous */
.gapline{font-size:1.15rem;line-height:2.4}
.gap{font:inherit;font-weight:800;min-width:5.2rem;border:3px dashed var(--ink);border-radius:10px;background:#fff;padding:.05rem .6rem;cursor:pointer}
.gap.act{background:var(--sun);border-style:solid}
.gap.full{background:var(--mint);border-style:solid;cursor:default}
.bank{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0 1rem}
.bchip{border:var(--bd);border-radius:10px;background:var(--blue);color:#fff;padding:.25rem .9rem;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.bchip:active{transform:translate(2px,2px);box-shadow:none}

/* Bits, lampes */
.bits{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.bit{display:inline-grid;place-items:center;width:1.9rem;height:2.4rem;border:var(--bd);border-radius:8px;background:#fff;font-family:var(--mono);font-weight:800;
  animation:pop .35s both;animation-delay:calc(var(--i,0)*60ms)}
.bit.on{background:var(--sun)}
@keyframes pop{from{transform:scale(.2);opacity:0}70%{transform:scale(1.2)}to{transform:scale(1);opacity:1}}
.lamps{display:flex;gap:.8rem;flex-wrap:wrap;margin:1rem 0}
.lamp{width:5.6rem;border:var(--bd);border-radius:16px;background:#fff;padding:.5rem .3rem;text-align:center;cursor:pointer;box-shadow:var(--sh)}
.lamp .bulb{width:2.6rem;height:2.6rem;margin:0 auto .3rem;border-radius:50%;border:var(--bd);background:#ddd;transition:background .15s,box-shadow .15s}
.lamp.on .bulb{background:var(--sun);box-shadow:0 0 0 6px var(--sun-l),0 0 22px 6px var(--sun)}
.lamp b{display:block;font-size:1.3rem}
.lamp small{display:block;font-size:.75rem}
.total{font-size:1.3rem;font-weight:800;margin:.4rem 0}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:1rem 0}
.compare div{border:var(--bd);border-radius:14px;padding:.6rem;text-align:center;background:#fff}
.compare b{display:block;font-size:2rem;font-family:var(--mono)}

/* Trajet de la lettre A */
.track{position:relative;padding-top:4.2rem;margin:.6rem 0 1.2rem}
.stns{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}
.stn{border:var(--bd);border-radius:14px;background:#fff;text-align:center;padding:.4rem .2rem;transition:background .2s,transform .2s}
.stn .em{display:block;font-size:1.9rem}
.stn .lb{font-size:.78rem;font-weight:800}
.stn.on{background:var(--sun);transform:translateY(-4px)}
.packet{position:absolute;top:0;left:10%;transform:translateX(-50%);opacity:0;min-width:3.4rem;text-align:center;padding:.3rem .7rem;
  background:var(--coral);color:#fff;border:var(--bd);border-radius:14px;box-shadow:3px 3px 0 var(--ink);font-family:var(--mono);font-weight:800;font-size:1.3rem;
  transition:left .8s ease-in-out,opacity .3s}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:.6rem 0}
.lnk{border:var(--bd);border-radius:14px;padding:.3rem .9rem;text-align:center;background:var(--blue-l);animation:pop .4s both}
.lnk small{display:block;font-size:.75rem;font-weight:700}
.lnk b{font-size:1.3rem;font-family:var(--mono)}
.arrow{font-size:1.5rem;font-weight:800;animation:pop .4s both}

/* Explorateurs */
.letters{display:flex;flex-wrap:wrap;gap:.35rem;margin:.6rem 0}
.letters button{width:2.2rem;height:2.2rem;border:var(--bd);border-radius:8px;background:#fff;font-weight:800;cursor:pointer;font-family:var(--mono)}
.letters button.seen{background:var(--mint-l)} .letters button.cur{background:var(--sun)}
.exout{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;border:var(--bd);border-radius:14px;background:var(--sun-l);padding:.7rem 1rem;min-height:4.4rem}
.exout .big{font-size:2rem;font-family:var(--mono);font-weight:800}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin:.4rem 0;animation:pop .4s both}
.trow .ch2{width:2.4rem;height:2.4rem;display:grid;place-items:center;background:var(--coral);color:#fff;border:var(--bd);border-radius:10px;font-family:var(--mono);font-weight:800}
.trow .code{min-width:2.6rem;text-align:center;font-family:var(--mono);font-weight:800;font-size:1.2rem}
.cpu{margin-top:1rem;border:var(--bd);border-radius:16px;background:var(--ink);color:#fff;padding:.6rem 1rem;overflow:hidden;box-shadow:0 0 0 5px var(--blue-l)}
.cpu .stream{white-space:nowrap;font-family:var(--mono);font-weight:800;font-size:1.4rem;color:var(--sun);animation:flow 6s linear infinite}
@keyframes flow{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.sl{width:100%;max-width:520px;accent-color:var(--blue)}

/* Divisions successives */
.div{border:var(--bd);border-radius:14px;background:#fff;padding:.6rem 1rem;margin:.6rem 0;font-family:var(--mono);font-weight:700}
.dl{padding:.1rem 0;animation:pop .35s both}
.dl .rest{color:var(--coral);background:transparent;padding:0 .3rem;border-radius:6px}
.dl.hl .rest{background:var(--sun);color:var(--ink)}
.res{margin-top:.5rem;font-size:1.2rem}
details{margin-top:.5rem}
summary{cursor:pointer;font-weight:800}

/* Cahier, tableaux */
.notebook{background:#FFFEF5;border:var(--bd);border-radius:14px;padding:.8rem 1.2rem;margin:.6rem 0 1rem;
  background-image:repeating-linear-gradient(transparent,transparent 31px,#cfd8ff 32px);line-height:32px}
.notebook p{margin:0;line-height:32px;transition:opacity .5s}
.notebook .hid{opacity:0}
.notebook .ex{font-family:var(--mono);font-weight:800;color:var(--blue)}
.notebook h3{line-height:32px;margin:0}
.ascii{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.2rem,1fr));gap:.3rem;margin:.6rem 0}
.ascii span{border:2px solid var(--ink);border-radius:8px;background:#fff;text-align:center;font-size:.85rem;font-family:var(--mono);font-weight:800}
.wts{display:flex;gap:4px;font-size:.7rem;font-family:var(--mono);font-weight:800}
.wts span{width:1.9rem;text-align:center}
.pick{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
.pick .opt{font-family:var(--mono)}
.ord{position:relative}
.ord .num{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--ink);color:#fff;margin-right:.4rem;font-size:.85rem}

/* Explications, poids des bits */
.scene{background:var(--sky);margin-bottom:1rem;box-shadow:3px 3px 0 var(--ink)}
.scene p:last-child{margin-bottom:0}
.chat{font-size:1.3rem;font-weight:800}
.narr{min-height:3.2rem;font-weight:700;background:var(--sun-l);border:var(--bd);border-radius:12px;padding:.5rem .9rem;margin:.8rem 0}
.bw{display:inline-flex;gap:4px;margin:.4rem 0}
.bwc{display:grid;justify-items:center;gap:2px}
.bwc small{font-family:var(--mono);font-weight:800;font-size:.75rem}
.packet{white-space:nowrap}
/* Bitou */
#bitou{position:fixed;right:.8rem;bottom:.8rem;z-index:25;display:flex;align-items:flex-end;gap:.4rem;pointer-events:none}
#bubble{max-width:250px;background:#fff;border:var(--bd);border-radius:16px;padding:.5rem .8rem;font-size:.9rem;font-weight:700;box-shadow:var(--sh);
  opacity:0;transform:translateY(8px);transition:.25s}
#bitou.show #bubble{opacity:1;transform:none}
#bitou.oops #bubble{background:var(--coral-l)}
.conf{position:fixed;top:-30px;z-index:60;pointer-events:none;font-family:var(--mono);font-weight:800;font-size:1.5rem}

/* Cahier (fenêtre) */
dialog{border:var(--bd);border-radius:18px;box-shadow:var(--sh);max-width:640px;width:92%;padding:1.2rem;color:var(--ink)}
dialog::backdrop{background:rgba(27,23,64,.6)}

/* ============ Bilan ============ */
.bilan h1{font-size:1.9rem}
.info{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;margin-bottom:1rem}
.info dt{font-weight:800} .info dd{margin:0}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin:1rem 0}
.res-c{border:var(--bd);border-radius:14px;padding:.6rem;text-align:center;background:#fff}
.res-c b{display:block;font-size:1.9rem;font-family:var(--mono)}
.res-c.stars{grid-column:1/-1;background:var(--sun);font-size:2.4rem;letter-spacing:.2rem}
.res-c.stars small{display:block;font-size:1rem;letter-spacing:0}
.map svg{width:100%;height:auto;display:block}
.write table{width:100%;border-collapse:collapse}
.write th,.write td{border:2px solid var(--ink);padding:.2rem .5rem;height:2.2rem;text-align:left}
.actions{display:flex;gap:.8rem;flex-wrap:wrap;margin:1.2rem 0}

@media (max-width:760px){
  html{font-size:16px}
  .cover{grid-template-columns:1fr}
  .hero h1{font-size:2rem}
  .ch .t{display:none} .ch.cur .t{display:block}
  .ch{min-width:0}
  .stn .lb{font-size:.62rem} .stn .em{font-size:1.4rem}
  #bubble{max-width:170px;font-size:.8rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.notebook .hid{opacity:1}}

/* ============ Impression (bilan) ============ */
@page{size:A4;margin:10mm}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
  .no-print,.top,.pausebanner,#bitou,dialog{display:none!important}
  #app{padding:0;max-width:none}
  .card{box-shadow:none;padding:.5rem .8rem;break-inside:avoid}
  .bilan h1{font-size:1.4rem}
  html{font-size:13px}
}
</style>
</head>
<body>

<!-- En-tête : chrono de 50 minutes, score, cahier, son -->
<header class="top no-print">
  <div class="brand"><b>0101</b><span>Langage machine</span></div>
  <div class="timer">
    <div class="tface">
      <span class="tlab">Temps restant (50 min)</span>
      <span id="tmr" class="mono">50:00</span>
      <button id="pause" class="mini" type="button" title="Pause" aria-label="Pause">⏸</button>
    </div>
    <div class="tbar" id="tbar"></div>
    <span class="tstat" id="tstat">Le chrono démarre avec le cours.</span>
  </div>
  <div class="tools">
    <span class="chip okc" id="okc" title="Bonnes réponses">✓ 0</span>
    <span class="chip errc" id="errc" title="Erreurs">✗ 0</span>
    <button id="cahierBtn" class="mini" type="button" title="Mon cahier" aria-label="Mon cahier">📒</button>
    <button id="snd" class="mini" type="button" title="Son" aria-label="Activer le son">🔇</button>
  </div>
</header>

<main id="app"></main>
<div class="pausebanner">⏸ Pause : appuie sur ▶ pour continuer</div>

<!-- Mascotte Bitou -->
<div id="bitou" class="no-print" aria-live="polite">
  <div id="bubble"></div>
  <svg viewBox="0 0 64 64" width="58" height="58" aria-hidden="true">
    <line x1="32" y1="4" x2="32" y2="15" stroke="#1B1740" stroke-width="3"/>
    <circle cx="32" cy="6" r="4" fill="#FFD23F" stroke="#1B1740" stroke-width="3"/>
    <rect x="8" y="26" width="6" height="12" rx="3" fill="#FF5D73" stroke="#1B1740" stroke-width="3"/>
    <rect x="50" y="26" width="6" height="12" rx="3" fill="#FF5D73" stroke="#1B1740" stroke-width="3"/>
    <rect x="12" y="15" width="40" height="38" rx="11" fill="#3D3BF3" stroke="#1B1740" stroke-width="3"/>
    <circle cx="24" cy="31" r="6" fill="#fff" stroke="#1B1740" stroke-width="2.5"/><circle cx="25" cy="32" r="2.5" fill="#1B1740"/>
    <circle cx="40" cy="31" r="6" fill="#fff" stroke="#1B1740" stroke-width="2.5"/><circle cx="41" cy="32" r="2.5" fill="#1B1740"/>
    <path d="M23 44 Q32 50 41 44" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </svg>
</div>

<dialog id="cahier"><div id="cahierBody"></div><p style="text-align:right;margin:.6rem 0 0"><button class="btn" type="button" id="cahierClose">Fermer</button></p></dialog>

<script>
/* =====================================================================
   COURS INTERACTIF : Le langage machine et le système binaire
   Fonctionne 100 % hors ligne : aucun serveur, aucune bibliothèque externe.
   Plan du code :
   1. Outils      2. État et chrono     3. Types de questions
   4. Contenu des chapitres             5. Écrans (garde, leçon, bilan)
   ===================================================================== */
(() => {
'use strict';

/* ---------- 1. Outils ---------- */
const $ = (s, r = document) => r.querySelector(s);
// Fabrique d’éléments : h('div', {class:'x', onclick:fn}, enfants...)
const h = (tag, a = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const k in a) {
    const v = a[k];
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
};
const sleep = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 60) : ms));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
const bin = (n, l = 0) => n.toString(2).padStart(l, '0');
const isBin = (v, n, len) => { v = v.replace(/\s/g, ''); return /^[01]+$/.test(v) && parseInt(v, 2) === n && (!len || v.length === len); };
const shake = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); };
const shuffle = a => { const b = a.slice(); do { for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } } while (b.every((x, i) => x === a[i])); return b; };

/* Sons (facultatifs, générés par le navigateur) */
let soundOn = false, ac;
function tone(f, d = .12, t = 0, type = 'square') {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + t;
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.05, s);
    g.gain.exponentialRampToValueAtTime(.0001, s + d);
    o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s + d);
  } catch (e) {}
}

/* Confettis : des 0 et des 1 qui tombent */
function confetti(n = 26) {

  const cols = ['#3D3BF3', '#FF5D73', '#22C58B', '#FFB800'];
  for (let i = 0; i < n; i++) {

    e.style.left = Math.random() * 100 + 'vw'; e.style.color = cols[i % 4];
    document.body.append(e);
    e.animate([{ transform: 'translateY(0) rotate(0)', opacity: 1 }, { transform: `translateY(${innerHeight + 60}px) rotate(${Math.random() * 540 - 270}deg)`, opacity: .8 }],
      { duration: 1400 + Math.random() * 1400, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => e.remove();
  }
}

function mcq(host, o, done) {
  const box = h('div', { class: 'q' }, h('p', { class: 'qt' }, o.q));
  const list = h('div', { class: 'opts' }), fb = h('p', { class: 'fb', 'aria-live': 'polite' });

  o.opts.forEach((t, i) => {

    b.onclick = () => {
      if (over || b.disabled) return;

        over = true; b.classList.add('good'); record(true); box.classList.add('solved');
        fb.className = 'fb good'; fb.textContent = '✅ ' + (o.why || 'Bravo !');
        [...list.children].forEach(x => x.disabled = true); done && done();
      } else {
        b.classList.add('bad'); b.disabled = true; record(false, o.hint || 'Regarde bien et réessaie !');
        fb.className = 'fb bad'; fb.textContent = '❌ ' + (o.hint || 'Pas tout à fait, réessaie !');

}

// Réponse à saisir
function ask(host, o, done) {
  const box = h('div', { class: 'q' }, h('p', { class: 'qt' }, o.q), o.pre || null);
  const inp = h('input', { class: 'inp' + (o.mono ? ' mono' : ''), type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: o.ph || 'Ta réponse', 'aria-label': o.q });
  const btn = h('button', { class: 'btn blue', type: 'button' }, 'Valider');
  const fb = h('p', { class: 'fb', 'aria-live': 'polite' });
  const row = h('div', { class: 'row' }, inp, btn);
  if (o.help) {
    const hb = h('button', { class: 'btn', type: 'button' }, '💡 Indice');
    hb.onclick = () => { hb.disabled = true; box.append(o.help()); };
    row.append(hb);
  }
  const test = () => {
    const v = inp.value.trim(); if (!v) return;
    if (o.check(v)) {
      record(true); inp.disabled = btn.disabled = true; box.classList.add('solved');
      fb.className = 'fb good'; fb.textContent = '✅ ' + (o.why || 'Bravo !');
      o.after && o.after(box); done && done();
    } else {
      record(false, o.hint); fb.className = 'fb bad'; fb.textContent = '❌ ' + (o.hint || 'Ce n’est pas ça, réessaie !'); shake(inp); inp.select();
    }
  };
  btn.onclick = test; inp.onkeydown = e => { if (e.key === 'Enter') test(); };
  box.append(row, fb); host.append(box); scrollTo(box); inp.focus({ preventScroll: true }); return box;
}

// Phrase à trous : on clique sur une étiquette pour remplir le trou actif
function gapfill(host, o, done) {
  const box = h('div', { class: 'q' }); const line = h('p', { class: 'gapline' });
  const slots = [], filled = []; let active = 0;
  o.parts.forEach(p => {
    if (typeof p === 'number') {
      const s = h('button', { class: 'gap', type: 'button', 'aria-label': 'Trou ' + (p + 1) }, '…');
      s.onclick = () => { if (!filled[p]) { active = p; paint(); } };
      slots[p] = s; line.append(s);
    } else line.append(p);
  });
  const fb = h('p', { class: 'fb' }); const bank = h('div', { class: 'bank' });
  const paint = () => slots.forEach((s, i) => s.classList.toggle('act', !filled[i] && i === active));
  o.bank.forEach(w => {
    const c = h('button', { class: 'bchip', type: 'button' }, w);
    c.onclick = () => {
      if (filled[active]) return;
      const dup = (o.unique || []).some(g => g.includes(active) && g.some(j => j !== active && filled[j] === w));
      if (o.gaps[active].includes(w) && !dup) {
        filled[active] = w; slots[active].textContent = w; slots[active].classList.add('full'); record(true);
        fb.className = 'fb good'; fb.textContent = '✅';
        const nx = slots.findIndex((_, i) => !filled[i]);
        if (nx === -1) { box.classList.add('solved'); paint(); done && done(); } else { active = nx; paint(); }
      } else {
        record(false, 'Ce mot ne va pas ici. Relis la phrase !'); fb.className = 'fb bad'; fb.textContent = '❌ Essaie un autre mot.'; shake(slots[active]);
      }
    };
    bank.append(c);
  });
  box.append(line, bank, fb); host.append(box); paint(); return box;
}

}

      (h3, cb2) => ask(h3, { q: 'Quelle lettre a ce numéro ASCII ?', ph: 'une lettre', check: v => v.trim().toUpperCase() === c, hint: 'Cherche ' + code + ' dans le tableau.', why: 'Lettre : ' + c }, cb2)
    ], cb);
  });
  seq(host, fns, () => { host.append(h('p', { class: 'lead fb good' }, '🔓 Message décodé : BIT !')); confetti(20); done(); });
}
function mission2(host, done) {
  host.append(groupNote('Chaque liste contient UNE conversion fausse. Trouvez-la, puis corrigez-la.'));
  const hunt = (title, lines, fixQ, fixCheck, fixWhy) => (h2, cb) => {
    h2.append(h('h3', {}, title)); const list = h('div', { class: 'opts' }), zone = h('div'); let over = false;
    lines.forEach(l => {
      const bt = h('button', { class: 'opt mono', type: 'button' }, l.t);
      bt.onclick = () => {
        if (over || bt.disabled) return;
        if (l.bad) { over = true; bt.classList.add('bad'); [...list.children].forEach(x => x.disabled = true); record(true); sfx.ok(); ask(zone, { q: fixQ, mono: true, check: fixCheck, hint: 'Refais la conversion pas à pas.', why: fixWhy }, cb); }
        else { bt.disabled = true; bt.classList.add('good'); record(false, 'Celle-ci est correcte. Vérifie les autres !'); }
      };
      list.append(bt);
    });
    h2.append(list, zone); scrollTo(list);
  };
  seq(host, [
    hunt('Décimal → binaire', [{ t: '6 = 110' }, { t: '9 = 1001' }, { t: '12 = 1010', bad: 1 }, { t: '7 = 111' }], 'Écris la bonne valeur de 12 en binaire :', v => isBin(v, 12), '12 = 1100₂'),
    hunt('Binaire → décimal', [{ t: '101 = 5' }, { t: '1101 = 12', bad: 1 }, { t: '1000 = 8' }, { t: '111 = 7' }], 'Écris la bonne valeur de 1101 en décimal :', v => +v === 13 && /^\d+$/.test(v), '1101₂ = 8 + 4 + 1 = 13')
  ], () => { confetti(16); done(); });
}
function mission3(host, done) {
  host.append(groupNote('Vous êtes le processeur ! Chaque membre du groupe code UNE lettre du mot ABC en 8 bits.'));
  const letters = [...'ABC'];
  seq(host, letters.map(c => (h2, cb) => {
    const n = c.charCodeAt(0);
    ask(h2, { q: `Lettre ${c} : code ASCII ${n}. Écris son octet en binaire (8 bits).`, mono: true, ph: '8 bits', check: v => isBin(v, n, 8), hint: 'Il faut 8 bits : complète avec des 0 à gauche. Astuce : 64 + 1 = 65.', help: divHelp(n), why: `${c} → ${n} → ${bin(n, 8)}` }, cb);
  }), () => {
    const all = letters.map(c => bin(c.charCodeAt(0), 8)).join(' ');
    host.append(h('div', { class: 'cpu' }, h('div', {}, '⚙️ Le processeur reçoit le mot ABC :'), h('div', { class: 'stream' }, all + ' ' + all)));
    host.append(h('p', { class: 'lead fb good', style: 'margin-top:1rem' }, '🎉 Mission accomplie : vous parlez le langage machine !')); confetti(30); sfx.win(); done();
  });
}

/* Plan des chapitres et durées (total : 50 minutes) */
const STEP = { act: ['🎬', 'Activité'], ded: ['💡', 'Je déduis'], tr: ['✍️', 'Trace écrite'], ex: ['🔍', 'Exemple'], exo: ['🏋️', 'Exercice'] };
const std = (a, d, t, e, x) => [[...STEP.act, a], [...STEP.ded, d], [...STEP.tr, trace(t)], [...STEP.ex, e], [...STEP.exo, x]].map(([icon, label, render]) => ({ icon, label, render }));
const CH = [
  { title: 'Rappel', steps: std(act0, ded0, 0, ex0, exo0) },
  { title: 'Le langage machine', steps: std(act1, ded1, 1, ex1, exo1) },
  { title: 'Le bit', steps: std(act2, ded2, 2, ex2, exo2) },
  { title: 'Le codage', steps: std(act3, ded3, 3, ex3, exo3) },
  { title: 'Les conversions', steps: std(act4, ded4, 4, ex4, exo4) },
  { title: 'Défis de groupe', steps: [{ icon: '🔓', label: 'Mission 1 : décryptage', render: mission1 }, { icon: '🕵️', label: 'Mission 2 : correction', render: mission2 }, { icon: '⚙️', label: 'Mission 3 : ABC', render: mission3 }] }
];

/* ---------- 5. Écrans ---------- */
const app = $('#app');

function renderCover(saved) {
  document.body.classList.remove('paused'); $('#pause').textContent = '⏸'; drawTimer();
  const flip = h('div', { class: 'flipper', 'aria-hidden': 'true' }, 'A'); const seqF = ['A', '65', '01000001']; let fi = 0;
  const iv = setInterval(() => {
    if (!flip.isConnected) return clearInterval(iv);
    flip.animate([{ transform: 'rotateX(0)' }, { transform: 'rotateX(90deg)' }], { duration: 170 }).onfinish = () => {
      fi = (fi + 1) % 3; flip.textContent = seqF[fi]; flip.style.fontSize = fi === 2 ? '1.9rem' : '2.4rem';
      flip.animate([{ transform: 'rotateX(-90deg)' }, { transform: 'rotateX(0)' }], { duration: 170 });
    };
  }, 2400);
  const start = h('button', { class: 'btn blue big', type: 'button' }, '🚀 Lancer le cours');
  start.onclick = () => {
    S = { ...fresh(), started: true }; updateChips(); drawTimer(); save();
    say('C’est parti ! Je suis Bitou, je t’aiderai en cas d’erreur. 🤖'); go(0, 0);
  };
  app.replaceChildren(h('div', { class: 'cover' },
    h('div', { class: 'hero' },
      h('span', { class: 'lvl' }, 'Tronc commun · Informatique'),
      h('h1', {}, 'Le langage du système informatique'),
      h('p', { class: 'sub' }, 'Le système binaire'),
      flip,
      h('p', {}, 'Séquence : Représentation de l’information (1 heure)'),
      h('p', { class: 'lead' }, h('b', {}, 'Professeur : EL MOUTAOUAKIL Khalid')),
      h('ul', { class: 'rules' }, h('li', {}, 'On commence par un rappel de la dernière leçon, puis on avance pas à pas : impossible de sauter une étape.'), h('li', {}, 'Chaque erreur compte pour le score et les étoiles.'), h('li', {}, 'Le chrono de 50 minutes démarre dès que vous lancez le cours.'))),
    h('div', {},
      h('div', { class: 'card setup' }, h('h2', {}, 'Prêts à commencer ?'), start),
      saved ? h('div', { class: 'card resume' }, h('p', {}, h('b', {}, 'Un cours est déjà en cours.')),
        h('button', { class: 'btn mint', type: 'button', onclick: () => { S = { ...fresh(), ...saved, paused: false }; updateChips(); drawTimer(); S.done ? renderBilan() : go(S.ch, S.st); } }, '↩ Reprendre là où vous vous êtes arrêtés')) : null)));
}

function go(ch, st) { S.ch = ch; S.st = st; save(); renderLesson(); window.scrollTo(0, 0); }

function renderLesson() {
  const c = CH[S.ch], step = c.steps[S.st];
  const chs = h('nav', { class: 'chs', 'aria-label': 'Chapitres' }, CH.map((x, i) => h('div', { class: 'ch ' + (i < S.ch ? 'done' : i === S.ch ? 'cur' : 'lock') }, h('span', { class: 'n' }, i < S.ch ? '✓' : i === 0 ? '↺' : String(i)), h('span', { class: 't' }, x.title), h('small', {}, '≈ ' + MINS[i] + ' min'))));
  const sts = h('div', { class: 'sts' }, c.steps.map((s, i) => h('span', { class: 's ' + (i < S.st ? 'done' : i === S.st ? 'cur' : 'lock') }, (i < S.st ? '✓ ' : s.icon + ' ') + s.label)));
  const host = h('div'), foot = h('div', { class: 'foot' });
  const last = S.st === c.steps.length - 1, final = last && S.ch === CH.length - 1;
  const nextBtn = h('button', { class: 'btn blue big', type: 'button' }, final ? 'Voir mon bilan 🏆' : last ? 'Chapitre suivant ➜' : 'Étape suivante ➜'); nextBtn.hidden = true;
  nextBtn.onclick = () => { if (final) finish(); else if (last) { confetti(20); sfx.win(); say('Chapitre terminé, bravo ! 🎉'); go(S.ch + 1, 0); } else go(S.ch, S.st + 1); };
  foot.append(nextBtn);
  app.replaceChildren(chs, sts, h('section', { class: 'card stage' }, h('h2', { class: 'stage-h' }, h('span', {}, step.icon), step.label, h('span', { class: 'sm' }, S.ch ? 'Chapitre ' + S.ch + ' : ' + c.title : 'Rappel de la dernière leçon')), host, foot));
  drawTimer(); let fin = false;
  step.render(host, () => { if (fin) return; fin = true; nextBtn.hidden = false; sfx.win(); say('Étape réussie ! Clique sur « suivant ».'); scrollTo(nextBtn); });
}

function finish() { S.done = true; S.paused = false; save(); drawTimer(); renderBilan(); window.scrollTo(0, 0); confetti(50); sfx.win(); }

// Carte mentale (SVG, adaptée à l’impression)
function mindmap() {
  const nodes = [
    ['Langage humain', 'lettres, mots, chiffres', 'l’ordinateur ne les comprend pas', 20, 20, '#BFE6FF', 125, 55],
    ['Système binaire', 'deux symboles seulement', '0 et 1', 530, 20, '#D5F7EA', 635, 55],
    ['Bit', '1 symbole = 1 bit', '0 = éteint, 1 = allumé', 545, 175, '#FFF3BF', 650, 210],
    ['Codage', 'transformer l’information', 'humaine en binaire', 530, 340, '#FFE0E5', 635, 375],
    ['Exemple ASCII', 'A → 65 → 01000001', 'un code, pas la lettre', 20, 340, '#DDDCFF', 125, 375],
    ['Conversions', 'décimal → binaire : ÷ 2', 'binaire → décimal : puissances de 2', 10, 175, '#D5F7EA', 115, 210]
  ];
  const cols = ['#3D3BF3', '#22C58B', '#FFB800', '#FF5D73', '#3D3BF3', '#22C58B'];
  const ns = 'http://www.w3.org/2000/svg';
  const wrap = h('div', { class: 'map', html: `<svg viewBox="0 0 760 420" role="img" aria-label="Carte mentale du cours">
    ${nodes.map((n, i) => `<line x1="380" y1="205" x2="${n[6]}" y2="${n[7]}" stroke="${cols[i]}" stroke-width="5" stroke-linecap="round"/>`).join('')}
    <ellipse cx="380" cy="205" rx="112" ry="46" fill="#FFD23F" stroke="#1B1740" stroke-width="4"/>
    <text x="380" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1B1740">Langage</text>
    <text x="380" y="222" text-anchor="middle" font-size="19" font-weight="800" fill="#1B1740">machine</text>
    ${nodes.map(n => `<rect x="${n[3]}" y="${n[4]}" width="220" height="70" rx="14" fill="${n[5]}" stroke="#1B1740" stroke-width="3"/>
      <text x="${n[3] + 110}" y="${n[4] + 24}" text-anchor="middle" font-size="15" font-weight="800" fill="#1B1740">${n[0]}</text>
      <text x="${n[3] + 110}" y="${n[4] + 44}" text-anchor="middle" font-size="11.5" fill="#1B1740">${n[1]}</text>
      <text x="${n[3] + 110}" y="${n[4] + 60}" text-anchor="middle" font-size="11.5" fill="#1B1740">${n[2]}</text>`).join('')}
  </svg>` });
  return wrap;
}

function renderBilan() {
  const tot = S.ok + S.err, score = tot ? Math.round(100 * S.ok / tot) : 0;
  const stars = S.err < 10 ? 3 : S.err <= 25 ? 2 : 1;      // 3 étoiles : < 10 erreurs ; 2 : de 10 à 25 ; 1 : plus de 25
  const msg = ['', 'Continuez à vous entraîner : le binaire n’aura bientôt plus de secret !', 'Très bien ! Encore un petit effort pour les 3 étoiles.', 'Excellent : votre groupe parle couramment le langage machine !'][stars];
  const date = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  const rc = (v, l) => h('div', { class: 'res-c' }, h('b', {}, String(v)), l);
  app.replaceChildren(h('section', { class: 'bilan' },
    h('h1', {}, 'Bilan du cours : Le langage machine et le système binaire'),
    h('div', { class: 'card' }, h('dl', { class: 'info' },
      h('dt', {}, 'Date :'), h('dd', {}, date),
      h('dt', {}, 'Temps utilisé :'), h('dd', {}, fmt(S.used) + ' sur 50:00'), h('dt', {}, 'Professeur :'), h('dd', {}, 'EL MOUTAOUAKIL Khalid'))),
    h('div', { class: 'results' },
      h('div', { class: 'res-c stars' }, '⭐'.repeat(stars) + '☆'.repeat(3 - stars), h('small', {}, stars + ' étoile' + (stars > 1 ? 's' : '') + ' : ' + msg)),
      rc(score + ' / 100', 'Score'), rc(S.ok, 'Bonnes réponses'), rc(S.err, 'Erreurs'), rc(tot, 'Réponses données')),
    h('div', { class: 'card' }, h('h2', {}, 'Carte mentale : ce qu’il faut retenir'), mindmap()),
    h('div', { class: 'card write', style: 'margin-top:1rem' }, h('h3', {}, 'À compléter à la main'),
      h('table', {}, h('thead', {}, h('tr', {}, ['Nom', 'Prénom', 'Classe', 'Groupe'].map(t => h('th', {}, t)))), h('tbody', {}, [1, 2, 3, 4].map(() => h('tr', {}, [1, 2, 3, 4].map(() => h('td'))))))),
    h('div', { class: 'actions no-print' },
      h('button', { class: 'btn blue big', type: 'button', onclick: () => window.print() }, '🖨️ Imprimer le bilan'),
      h('button', { class: 'btn coral', type: 'button', onclick: () => { if (confirm('Recommencer ? Les résultats du groupe seront effacés.')) { wipe(); S = fresh(); updateChips(); renderCover(null); } } }, '↻ Nouveau groupe')),
    h('p', { class: 'no-print' }, 'Astuce : dans la fenêtre d’impression, choisis « Enregistrer au format PDF » pour obtenir un fichier PDF.')));
}

/* ---------- Démarrage ---------- */
const saved = load();
updateChips(); drawTimer();
if (saved && saved.started) { renderCover(saved); } else renderCover(null);
})();
</script>
<!-- a11y-clavier -->
<script>
(function(){
  // Rend utilisables au clavier (Tab, Entrée/Espace, flèches) les éléments cliquables qui ne sont pas des boutons natifs.
  var NATIVE = 'button,a[href],input,select,textarea,summary';
  function enhance(){
    document.querySelectorAll('body *').forEach(function(el){
      if (typeof el.onclick !== 'function' || el.matches(NATIVE) || el.hasAttribute('data-kbd')) return;
      el.setAttribute('data-kbd', '');
      if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
      if (!el.hasAttribute('role')) el.setAttribute('role', 'button');
      if (!el.textContent.trim() && !el.hasAttribute('aria-label')) {
        el.setAttribute('aria-label', 'Case ' + (Array.prototype.indexOf.call(el.parentNode.children, el) + 1));
      }
    });
  }
  document.addEventListener('keydown', function(e){
    var el = e.target;
    if (!(el instanceof Element) || !el.hasAttribute('data-kbd')) return;
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      el.dispatchEvent(new MouseEvent('click', {bubbles: true, cancelable: true}));
      return;
    }
    var dir = {ArrowRight: 1, ArrowLeft: -1, ArrowDown: 'down', ArrowUp: 'up'}[e.key];
    if (!dir) return;
    var sibs = Array.prototype.filter.call(el.parentNode.children, function(s){ return s.hasAttribute('data-kbd'); });
    if (sibs.length < 2) return;
    var cols = getComputedStyle(el.parentNode).gridTemplateColumns.split(' ').filter(function(c){ return c && c !== 'none'; }).length || 1;
    var step = dir === 'down' ? cols : dir === 'up' ? -cols : dir;
    var next = sibs[sibs.indexOf(el) + step];
    if (next) { e.preventDefault(); next.focus(); }
  });
  document.querySelectorAll('#msg,.msg,#progress,.progress,.narr').forEach(function(el){
    if (!el.hasAttribute('aria-live')) el.setAttribute('aria-live', 'polite');
  });
  var pending = false;
  new MutationObserver(function(){
    if (pending) return;
    pending = true;
    setTimeout(function(){ pending = false; enhance(); }, 0);
  }).observe(document.body, {childList: true, subtree: true});
  enhance();
})();
</script>
